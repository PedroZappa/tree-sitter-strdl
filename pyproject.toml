[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-strudel"
description = "Parser for Strudel, a Tidal Cycles base live coding tool"
version = "2.0.1"
keywords = ["incremental", "parsing", "tree-sitter", "strudel"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Zedro", email = "45104292+PedroZappa@users.noreply.github.com " }]
requires-python = ">=3.10"
license.text = "AGPL-3.0-only"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/pedrozappa/tree-sitter-strdl"

[project.optional-dependencies]
core = ["tree-sitter~=0.25.0"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["bindings/python/tree_sitter_strudel/binding.c"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
